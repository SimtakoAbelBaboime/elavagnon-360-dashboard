<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELAVAGNON 360 — Pilotage client augmenté par l'IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#F6F4EF;
  --panel:#FFFFFF;
  --panel-2:#F0ECE3;
  --border:#DCD5C4;
  --ink:#1C1B18;
  --ink-soft:#5B5648;
  --muted:#8A8474;
  --accent:#B7791F;       /* or/amber - énergie */
  --accent-2:#2F6F4E;     /* vert - croissance */
  --accent-3:#B23B32;     /* corail/rouge - risque */
  --accent-4:#2B5D82;     /* bleu ardoise - info */
  --chip-bg:#EFE7D3;
  --font-display:'Sora',sans-serif;
  --font-body:'IBM Plex Sans',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
  --shadow:none;
  --radius:2px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12172A;
    --panel:#181F38;
    --panel-2:#1E2645;
    --border:#2C3559;
    --ink:#F1EFE6;
    --ink-soft:#C3C2D4;
    --muted:#8A8FB0;
    --accent:#F2B544;
    --accent-2:#3FCB84;
    --accent-3:#FF7A68;
    --accent-4:#5AA9E0;
    --chip-bg:#232B4C;
  }
}
:root[data-theme="dark"]{
  --bg:#12172A;
  --panel:#181F38;
  --panel-2:#1E2645;
  --border:#2C3559;
  --ink:#F1EFE6;
  --ink-soft:#C3C2D4;
  --muted:#8A8FB0;
  --accent:#F2B544;
  --accent-2:#3FCB84;
  --accent-3:#FF7A68;
  --accent-4:#5AA9E0;
  --chip-bg:#232B4C;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

h1,h2,h3,h4{font-family:var(--font-display);margin:0;color:var(--ink);}

.app{
  display:grid;
  grid-template-columns:236px 1fr;
  min-height:100vh;
}

/* ============ SIDEBAR ============ */
.sidebar{
  background:var(--panel);
  border-right:1px solid var(--border);
  padding:22px 16px;
  display:flex;
  flex-direction:column;
  gap:22px;
  position:sticky;
  top:0;
  height:100vh;
}
.brand{padding:0 6px;}
.brand .mark{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:34px;height:34px;
  background:var(--accent);
  color:#12172A;
  font-family:var(--font-display);
  font-weight:800;
  font-size:15px;
  border-radius:8px;
  margin-bottom:10px;
}
.brand h1{font-size:17px;letter-spacing:-0.01em;}
.brand p{margin:2px 0 0;font-size:11.5px;color:var(--muted);}

.nav{display:flex;flex-direction:column;gap:2px;flex:1;}
.nav button{
  all:unset;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  border-radius:8px;
  font-size:13.5px;
  font-weight:500;
  color:var(--ink-soft);
  transition:background .15s ease, color .15s ease;
}
.nav button svg{width:16px;height:16px;flex:none;opacity:.85;}
.nav button:hover{background:var(--panel-2);color:var(--ink);}
.nav button.active{background:var(--accent);color:#1B1404;font-weight:600;}
.nav .grp-label{
  font-size:10.5px;
  text-transform:uppercase;
  letter-spacing:.06em;
  color:var(--muted);
  padding:14px 12px 4px;
}

.sidebar-foot{
  border-top:1px solid var(--border);
  padding-top:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}
.theme-toggle{
  all:unset;
  cursor:pointer;
  font-size:11.5px;
  color:var(--muted);
  border:1px solid var(--border);
  padding:6px 10px;
  border-radius:20px;
}
.theme-toggle:hover{color:var(--ink);border-color:var(--accent);}
.roleflag{font-size:11px;color:var(--muted);}

/* ============ MAIN ============ */
main{padding:26px 34px 60px;max-width:1180px;}
.view{display:none;}
.view.active{display:block;animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

.view-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;gap:20px;flex-wrap:wrap;}
.view-head h2{font-size:24px;letter-spacing:-0.02em;}
.view-head p{margin:6px 0 0;color:var(--muted);font-size:13px;max-width:560px;}
.eyebrow{font-size:11px;color:var(--accent);font-weight:600;margin-bottom:6px;}

/* KPI row */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:22px;}
.kpi{
  background:var(--panel);
  border:1px solid var(--border);
  border-left:3px solid var(--accent);
  padding:14px 16px;
  border-radius:var(--radius);
}
.kpi.pos{border-left-color:var(--accent-2);}
.kpi.risk{border-left-color:var(--accent-3);}
.kpi.info{border-left-color:var(--accent-4);}
.kpi .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
.kpi .value{font-family:var(--font-display);font-size:24px;font-weight:700;margin-top:6px;}
.kpi .sub{font-size:11.5px;color:var(--muted);margin-top:3px;}

/* grid layout */
.grid{display:grid;gap:16px;}
.grid.two{grid-template-columns:1.3fr 1fr;}
.grid.three{grid-template-columns:repeat(3,1fr);}
@media(max-width:900px){.grid.two,.grid.three{grid-template-columns:1fr;}}

.panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px 18px 14px;
}
.panel h3{font-size:14px;font-weight:600;margin-bottom:2px;}
.panel .panel-sub{font-size:11.5px;color:var(--muted);margin-bottom:14px;}
.chart-wrap{position:relative;height:230px;}
.chart-wrap.sm{height:180px;}

/* tables */
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th{
  text-align:left;
  font-size:10.5px;
  text-transform:uppercase;
  letter-spacing:.04em;
  color:var(--muted);
  border-bottom:1px solid var(--border);
  padding:7px 8px;
  font-weight:600;
}
td{padding:8px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--panel-2);}
.pill{
  display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:600;
  background:var(--chip-bg);color:var(--ink-soft);
}
.pill.risk-Élevé{background:rgba(178,59,50,.18);color:var(--accent-3);}
.pill.risk-Moyen{background:rgba(183,121,31,.18);color:var(--accent);}
.pill.risk-Faible{background:rgba(47,111,78,.18);color:var(--accent-2);}

/* buttons */
.btn{
  all:unset;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;
  background:var(--accent);color:#1B1404;
  font-size:12px;font-weight:600;
  padding:7px 12px;border-radius:6px;
  transition:opacity .15s ease;
}
.btn:hover{opacity:.85;}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--ink-soft);}
.btn.ghost:hover{border-color:var(--accent);color:var(--ink);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn.sm{padding:4px 9px;font-size:11px;}

select,input[type=text]{
  font-family:var(--font-body);
  background:var(--panel-2);
  border:1px solid var(--border);
  color:var(--ink);
  padding:7px 10px;
  border-radius:6px;
  font-size:12.5px;
}

/* agent card */
.agent-card{
  border:1px solid var(--border);
  border-radius:var(--radius);
  background:var(--panel);
  padding:16px 18px;
  margin-bottom:14px;
}
.agent-card .tag{
  display:inline-flex;align-items:center;gap:6px;
  font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  color:var(--accent-4);margin-bottom:8px;
}
.agent-card .tag .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
.agent-card p{margin:0 0 8px;font-size:13px;color:var(--ink-soft);}
.agent-card code{font-family:var(--font-mono);font-size:11px;background:var(--panel-2);padding:1px 5px;border-radius:4px;}

.ai-output{
  margin-top:10px;
  border-left:2px solid var(--accent);
  padding:10px 14px;
  background:var(--panel-2);
  border-radius:0 6px 6px 0;
  font-size:13px;
  color:var(--ink);
  white-space:pre-wrap;
  display:none;
}
.ai-output.show{display:block;}
.draft-label{display:block;margin-top:12px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
.draft-message{width:100%;min-height:92px;margin-top:6px;resize:vertical;font:inherit;font-size:13px;line-height:1.5;color:var(--ink);background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:9px 10px;}
.copy-message{margin-top:7px;}
.loading-dots{display:inline-flex;gap:3px;align-items:center;}
.loading-dots span{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:blink 1.2s infinite;}
.loading-dots span:nth-child(2){animation-delay:.2s;}
.loading-dots span:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.2;}40%{opacity:1;}}

/* chat */
.chat-box{border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);padding:16px 18px;}
.chat-log{display:flex;flex-direction:column;gap:10px;max-height:340px;overflow-y:auto;margin-bottom:12px;padding-right:4px;}
.msg{max-width:88%;padding:9px 12px;border-radius:8px;font-size:13px;}
.msg.user{align-self:flex-end;background:var(--accent);color:#1B1404;}
.msg.ai{align-self:flex-start;background:var(--panel-2);color:var(--ink);white-space:pre-wrap;}
.chat-input-row{display:flex;gap:8px;}
.chat-input-row input{flex:1;}
.suggestions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.suggestion-chip{
  all:unset;cursor:pointer;font-size:11.5px;
  border:1px solid var(--border);border-radius:20px;
  padding:5px 11px;color:var(--muted);
}
.suggestion-chip:hover{border-color:var(--accent);color:var(--ink);}

.legend-row{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:8px;}
.legend-row span{display:inline-flex;align-items:center;gap:5px;}
.legend-row i{width:8px;height:8px;border-radius:2px;display:inline-block;}

.section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:26px 0 10px;}
.section-title:first-child{margin-top:0;}

.client-detail{border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;background:var(--panel);margin-top:14px;display:none;}
.client-detail.show{display:block;}
.client-detail .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:12px 0;}
.client-detail .kv div{font-size:11px;color:var(--muted);}
.client-detail .kv strong{display:block;font-size:14px;color:var(--ink);font-weight:600;margin-top:2px;}

.foot-note{font-size:11px;color:var(--muted);margin-top:30px;padding-top:16px;border-top:1px solid var(--border);}

@media(max-width:760px){
  .app{grid-template-columns:1fr;}
  .sidebar{position:relative;height:auto;flex-direction:row;overflow-x:auto;}
  .nav{flex-direction:row;overflow-x:auto;}
  .grp-label{display:none;}
  main{padding:18px;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark">EL</div>
      <h1>ELAVAGNON 360</h1>
      <p>Pilotage client augmenté par l'IA</p>
    </div>
    <nav class="nav" id="nav">
      <div class="grp-label">Pilotage</div>

      <div class="grp-label">Données &amp; IA</div>

    <div class="sidebar-foot">
      <span class="roleflag" id="dateRef"></span>

  </aside>

  <main id="main"></main>
</div>

<script>
const DATA = JSON.parse(document.getElementById('app-data').textContent);
const fmtFCFA = n => Math.round(n).toLocaleString('fr-FR') + ' FCFA';
const fmtNum = n => Number(n).toLocaleString('fr-FR');

/* ============ THEME ============ */
const themeBtn = document.getElementById('themeToggle');
function applyTheme(t){
  if(t){ document.documentElement.setAttribute('data-theme', t); }
  else { document.documentElement.removeAttribute('data-theme'); }
  themeBtn.textContent = (t==='dark') ? 'Mode clair' : 'Mode sombre';
}
applyTheme(null);
themeBtn.addEventListener('click', ()=>{
  const cur = document.documentElement.getAttribute('data-theme');
  applyTheme(cur==='dark' ? 'light' : 'dark');
});
document.getElementById('dateRef').textContent = 'Données au 04/09/2026';

/* ============ CLAUDE (sample capability) ============ */
let claudeSample = null;

    if (typeof claude !== 'undefined') claudeSample = await claude.use('sample');

const CONTEXT_SUMMARY = `Tu es l'agent d'analyse client d'ELAVAGNON, une PME togolaise qui vend des produits/services à des jeunes actifs (Produit A, Produit B, Produit C, Pack Premium, Pack Entreprise, Service X).
Voici un résumé chiffré de la base de 200 clients (analyse au 04/09/2026) :
- Chiffre d'affaires total : ${fmtFCFA(DATA.kpi_globaux.ca_total)} sur ${DATA.kpi_globaux.nb_commandes} commandes, panier moyen ${fmtFCFA(DATA.kpi_globaux.panier_moyen)}.
- Satisfaction moyenne : ${DATA.kpi_globaux.satisfaction_moyenne}/5. Taux de clients actifs (achat <90j) : ${DATA.kpi_globaux.taux_actifs_90j}%.
- Segmentation comportementale (nb clients) : ${JSON.stringify(DATA.clients_par_segment)}.
- CA par segment : ${JSON.stringify(DATA.ca_par_segment)}.
- Niveaux de risque de churn (score 0-100 basé sur récence d'achat, réclamations non résolues, satisfaction) : ${JSON.stringify(DATA.risque_churn)}.
- Top produits par segment : ${JSON.stringify(DATA.top_produits_par_segment)}.
- Performance par canal d'acquisition (nb clients, satisfaction moy, CA moyen) : ${JSON.stringify(DATA.performance_canaux)}.
- Sentiment des avis clients (NLP) : ${JSON.stringify(DATA.sentiment_avis)}. Thèmes récurrents : ${JSON.stringify(DATA.themes_avis)}.
- Motifs de réclamations : ${JSON.stringify(DATA.motifs_reclamations)}. Gravité : ${JSON.stringify(DATA.gravite_reclamations)}.
- ${DATA.nb_opportunites_cross_sell} opportunités de vente croisée identifiées chez les "Brand Lovers".
Réponds toujours en français, de façon concise (5-8 lignes maximum), concrète et orientée action pour une PME. Appuie-toi uniquement sur les chiffres fournis, ne les invente pas. Structure ta réponse avec des tirets si utile.`;

function localAgentResponse(prompt){
  const text = prompt.toLowerCase();
  const jsonMatch = prompt.match(/\{[\s\S]*\}/);
  let profile = null;
  if (jsonMatch) {
    try { profile = JSON.parse(jsonMatch[0]); } catch(e) { profile = null; }
  }
  if (profile?.client_id) {
    profile = {...(DATA.clients_table.find(c=>c.client_id === profile.client_id) || {}), ...profile};
  }
  const segment = profile?.segment_ia || 'client';
  const risk = Number(profile?.risque_churn || 0);
  const satisfaction = Number(profile?.satisfaction || 0);
  const recency = Number(profile?.recence_jours || 0);
  const orders = Number(profile?.nb_commandes || 0);
  const favorite = profile?.produit_favori || 'son produit habituel';
  const city = profile?.ville || 'sa ville';
  const channel = profile?.canal_acquisition || 'son canal habituel';
  const suggested = profile?.produits_suggeres?.join(' et ') || 'une offre complémentaire';
  const urgency = risk >= 60 ? 'très urgente' : risk >= 35 ? 'prioritaire' : 'préventive';
  const contact = risk >= 60 || recency > 180 ? 'un appel ou un message WhatsApp personnalisé' : `une relance via ${channel}`;
  const offer = segment === 'Brand Lover' ? `un accès privilégié lié à ${favorite}`
    : segment === 'Explorateur à risque' || segment === 'Dormant' ? 'une offre de réactivation simple, avec un avantage limité dans le temps'
    : segment === 'Acheteur Opportuniste' ? 'un pack d’entrée clair et abordable'
    : 'une recommandation complémentaire à son historique';

  if (profile && (text.includes('plan d\'action') || text.includes('rétention') || text.includes('risque élevé'))) {
    return `- Priorité ${urgency} pour ${profile.client_id}, à ${city} : risque ${Math.round(risk)}/100 et dernier achat il y a ${Math.round(recency)} jours.\n- Contact : ${contact}, avec un message qui reconnaît son historique de ${Math.round(orders)} commande(s).\n- Satisfaction actuelle : ${satisfaction}/5 ; commencez par résoudre ou vérifier toute insatisfaction avant de vendre.\n- Proposition : ${offer}.\n- Objectif cette semaine : obtenir une réponse et programmer un prochain achat.`;
  }
  if (profile && (text.includes('client précis') || text.includes('recommandation personnalisée'))) {
    return `- ${profile.client_id} est un profil « ${segment} » acquis via ${channel}, avec ${Math.round(orders)} commande(s) et ${satisfaction}/5 de satisfaction.\n- Message conseillé : remercier le client pour ${favorite}, puis proposer une suite adaptée à ses usages.\n- Canal : ${contact}.\n- Offre : ${offer}.\n- Adapter le ton : rassurant si le risque est ${Math.round(risk)}/100, valorisant si le client est fidèle.`;
  }
  if (profile && (text.includes('vente') || text.includes('whatsapp'))) {
    return `- Message pour ${profile.client_id} : « Bonjour, nous avons pensé à vous depuis ${city}. Après ${favorite}, découvrez ${suggested}, choisi pour compléter vos habitudes. »\n- ${Math.round(orders)} commande(s) et un risque de ${Math.round(risk)}/100 : privilégiez une proposition personnalisée plutôt qu'une promotion générique.\n- Contactez-le via ${channel} et proposez une offre découverte courte.\n- Relancez sous 3 jours si le message reste sans réponse.`;
  }
  if (text.includes('newsletter')) {
    const seg = prompt.match(/segment "([^"]+)"/i)?.[1] || 'vos clients';
    const products = DATA.top_produits_par_segment[seg]?.slice(0,2).map(x=>x.produit).join(' et ') || 'vos produits stars';
    return `- Segment ciblé : ${seg}.\n- Objet : Découvrez ${products}, les incontournables du moment.\n- Contenu : présentez ces offres avec un bénéfice concret et un appel à l'action simple.\n- Appuyez le message par une relance personnalisée selon l'historique d'achat.`;
  }
  if (text.includes('chiffre') || text.includes('ca ') || text.includes('revenu')) {
    const best = Object.entries(DATA.ca_par_segment).sort((a,b)=>b[1]-a[1])[0];
    return `- Le chiffre d'affaires total est de ${fmtFCFA(DATA.kpi_globaux.ca_total)} sur ${DATA.kpi_globaux.nb_commandes} commandes.\n- Le panier moyen est de ${fmtFCFA(DATA.kpi_globaux.panier_moyen)}.\n- Le segment qui contribue le plus est « ${best[0]} » avec ${fmtFCFA(best[1])}.\n- Action : protéger ce segment tout en réactivant les segments à risque.`;
  }
  if (text.includes('segment') || text.includes('clientèle')) {
    const ranking = Object.entries(DATA.clients_par_segment).sort((a,b)=>b[1]-a[1]).slice(0,3);
    return `- Les trois segments les plus représentés sont ${ranking.map(([name,count])=>`« ${name} » (${count})`).join(', ')}.\n- « ${ranking[0][0]} » constitue le premier vivier à travailler.\n- Utilisez une offre différente par segment : fidélisation pour les Brand Lovers, réactivation pour les Dormants, découverte pour les Opportunistes.`;
  }
  if (text.includes('produit') || text.includes('offre')) {
    const products = Object.entries(DATA.top_produits_par_segment).flatMap(([,items])=>items);
    const totals = products.reduce((acc,item)=>{ acc[item.produit]=(acc[item.produit]||0)+item.ca; return acc; },{});
    const best = Object.entries(totals).sort((a,b)=>b[1]-a[1])[0];
    return `- Le produit le plus performant dans les segments analysés est ${best[0]}, avec environ ${fmtFCFA(best[1])} de CA cumulé.\n- Vérifiez ensuite son adéquation avec le segment ciblé avant toute campagne.\n- Pour une campagne, associez le produit à un bénéfice concret et à une offre courte.`;
  }
  if (text.includes('canal') || text.includes('acquisition')) {
    const channel = [...DATA.performance_canaux].sort((a,b)=>b.ca_moyen-a.ca_moyen)[0];
    return `- Le canal au CA moyen le plus élevé est ${channel.canal_acquisition}, à ${fmtFCFA(channel.ca_moyen)} par client.\n- Sa satisfaction moyenne est de ${channel.satisfaction_moy}/5 pour ${channel.nb_clients} client(s).\n- Action : conserver ce canal pour les profils à forte valeur et comparer son coût avant d'augmenter le budget.`;
  }
  if (text.includes('satisfaction') || text.includes('avis') || text.includes('sentiment')) {
    return `- La satisfaction moyenne est de ${DATA.kpi_globaux.satisfaction_moyenne}/5.\n- Les avis sont majoritairement positifs (${DATA.sentiment_avis.Positif}), mais ${DATA.sentiment_avis.Négatif} avis restent négatifs.\n- Les thèmes les plus cités sont ${Object.entries(DATA.themes_avis).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([name])=>name).join(' et ')}.\n- Action : traiter ces thèmes dans les messages et le suivi client.`;
  }
  if (text.includes('réclamation') || text.includes('plainte') || text.includes('incident')) {
    const motif = Object.entries(DATA.motifs_reclamations).sort((a,b)=>b[1]-a[1])[0];
    return `- ${DATA.kpi_globaux.taux_reclamations_non_resolues}% des réclamations ne sont pas résolues.\n- Le motif le plus fréquent est « ${motif[0]} » avec ${motif[1]} cas.\n- Traitez d'abord les réclamations élevées et non résolues, puis confirmez la résolution au client.\n- Mesurez chaque semaine le délai moyen de réponse.`;
  }
  if (text.includes('qui') && (text.includes('prior') || text.includes('risque'))) {
    const atRisk = DATA.clients_risque_eleve.slice(0,3).map(c=>`${c.client_id} (${Math.round(c.risque_churn)}/100)`).join(', ');
    return `- Les premiers clients à recontacter sont ${atRisk}.\n- Commencez par un message relationnel, sans promotion immédiate.\n- Vérifiez leur dernière expérience et proposez ensuite une solution adaptée à leur segment.`;
  }
  if (text.includes('rétention') || text.includes('churn') || text.includes('risque élevé')) {
    return `- Priorité 1 : contacter rapidement le client avec un message personnalisé.\n- Priorité 2 : traiter toute réclamation non résolue et confirmer sa résolution.\n- Priorité 3 : proposer une offre liée à son segment et à ses achats précédents.\n- Le tableau compte ${DATA.risque_churn['Élevé']} clients à risque élevé et ${DATA.kpi_globaux.taux_reclamations_non_resolues}% de réclamations non résolues.`;
  }
  if (text.includes('vente') || text.includes('whatsapp')) {
    return `- Contactez le client par WhatsApp avec un message court et personnalisé.\n- Mettez en avant les produits recommandés selon son historique.\n- Proposez une offre découverte limitée dans le temps.\n- Les opportunités de vente croisée identifiées sont au nombre de ${DATA.nb_opportunites_cross_sell}.`;
  }
  if (text.includes('synthèse') || text.includes('priorités') || text.includes('constats')) {
    return `- Le chiffre d'affaires atteint ${fmtFCFA(DATA.kpi_globaux.ca_total)} sur ${DATA.kpi_globaux.nb_commandes} commandes.\n- ${DATA.kpi_globaux.taux_actifs_90j}% des clients ont acheté dans les 90 derniers jours.\n- La satisfaction moyenne est de ${DATA.kpi_globaux.satisfaction_moyenne}/5.\n- Priorités : réduire les réclamations non résolues, réactiver les clients à risque et développer le cross-sell.`;
  }
  return `- La base compte ${DATA.kpi_globaux.nb_clients} clients et ${DATA.kpi_globaux.nb_commandes} commandes.\n- Le chiffre d'affaires total est de ${fmtFCFA(DATA.kpi_globaux.ca_total)}.\n- Les clients actifs représentent ${DATA.kpi_globaux.taux_actifs_90j}% de la base.\n- Consultez les vues Marketing, Commercial et Relation client pour une recommandation ciblée.`;
}

function profileFromPrompt(prompt){
  const match = prompt.match(/\{[\s\S]*\}/);
  if (!match) return null;
  try {
    const raw = JSON.parse(match[0]);
    return {...(DATA.clients_table.find(c=>c.client_id === raw.client_id) || {}), ...raw};
  } catch(e) { return null; }
}

function draftMessage(profile, prompt){
  if (!profile?.client_id) return null;
  const intent = prompt.replace(/\{[\s\S]*\}/, '').toLowerCase();
  const product = profile.produit_favori || 'vos achats habituels';
  const suggested = profile.produits_suggeres?.join(' et ') || 'une sélection complémentaire à vos habitudes';
  const risk = Number(profile.risque_churn || 0);
  if (intent.includes('vente') || intent.includes('whatsapp')) {
    return `Bonjour,\n\nUne attention particulière pour vous : après ${product}, nous vous avons réservé une sélection autour de ${suggested}. Une façon élégante de prolonger votre expérience ELAVAGNON, à votre rythme.\n\nNotre équipe se tient à votre disposition pour vous conseiller.\n\nAu plaisir de vous accompagner.`;
  }
  if (risk >= 60 || intent.includes('risque élevé') || intent.includes('rétention')) {
    return `Bonjour,\n\nNous espérons que votre dernière expérience avec ${product} a répondu à vos attentes. Votre avis nous est précieux et nous aimerions pouvoir vous accompagner encore mieux.\n\nDites-nous simplement comment nous pouvons vous être utiles : notre équipe sera heureuse de vous proposer une attention personnalisée.\n\nBien cordialement,\nL'équipe ELAVAGNON`;
  }
  return `Bonjour,\n\nMerci pour votre confiance envers ELAVAGNON. Nous avons imaginé une proposition personnalisée autour de ${product}, pensée pour prolonger agréablement votre expérience.\n\nSouhaitez-vous que notre équipe vous en présente les détails ?\n\nAu plaisir de vous retrouver,\nL'équipe ELAVAGNON`;
}

function newsletterDraft(prompt){
  const match = prompt.match(/segment "([^"]+)"/i);
  if (!match) return null;
  const segment = match[1];
  const products = DATA.top_produits_par_segment[segment]?.slice(0,2).map(item=>item.produit).join(' et ') || 'nos offres du moment';
  const subject = segment === 'Brand Lover' ? 'Une attention exclusive pour nos clients privilégiés'
    : segment === 'Dormant' || segment === 'Explorateur à risque' ? 'Une belle occasion de vous retrouver'
    : `Les essentiels ELAVAGNON pour ${segment}`;
  return `Objet : ${subject}\n\nBonjour,\n\nChez ELAVAGNON, nous avons sélectionné ${products}, des offres choisies pour vous accompagner au quotidien. Découvrez leurs avantages et profitez d'une attention exclusive réservée à notre communauté.\n\nNotre équipe est à votre écoute pour vous conseiller et vous aider à faire le meilleur choix.\n\nÀ très bientôt,\nL'équipe ELAVAGNON`;
}

function renderAgentResult(outEl, response, prompt){
  const profile = profileFromPrompt(prompt);
  outEl.textContent = response;
  const message = draftMessage(profile, prompt) || newsletterDraft(prompt);
  if (!message) return;
  const label = document.createElement('label');
  label.className = 'draft-label';
  label.textContent = 'Message proposé, modifiable avant envoi';
  const textarea = document.createElement('textarea');
  textarea.className = 'draft-message';
  textarea.value = message;
  textarea.setAttribute('aria-label', 'Message client modifiable');
  const copy = document.createElement('button');
  copy.className = 'btn sm ghost copy-message';
  copy.type = 'button';
  copy.textContent = 'Copier le message';
  copy.addEventListener('click', async () => {
    await navigator.clipboard.writeText(textarea.value);
    copy.textContent = 'Message copié';
    setTimeout(() => { copy.textContent = 'Copier le message'; }, 1600);
  });
  outEl.append(label, textarea, copy);
}

async function askAgent(prompt, outEl, opts={}){
  if(!claudeSample){
    try {
      if (typeof claude !== 'undefined') claudeSample = await claude.use('sample');
    } catch(e){}
  }
  if(!claudeSample){
    outEl.classList.add('show');
    renderAgentResult(outEl, localAgentResponse(prompt), prompt);
    return;
  }
  outEl.classList.add('show');
  outEl.innerHTML = '<span class="loading-dots"><span></span><span></span><span></span></span>';
  try{
    const res = await claudeSample([
      {role:'user', content: (opts.system || CONTEXT_SUMMARY) + "\n\n" + prompt}
    ], { modelTier:'default', onText: ({text}) => { outEl.textContent = text; } });
    renderAgentResult(outEl, res.text, prompt);
  }catch(err){
    renderAgentResult(outEl, localAgentResponse(prompt), prompt);
  }
}

    <input type="text" id="clientSearch" placeholder="Rechercher un ID client (ex: CL014)">
    <select id="filterSeg"><option value="">Tous les segments</option>${segOpts}</select>
    <select id="filterRisk"><option value="">Tous les niveaux de risque</option><option value="Élevé">Risque élevé</option><option value="Moyen">Risque moyen</option><option value="Faible">Risque faible</option></select>

    <tbody id="clientTableBody"></tbody></table>
    </div>
  </div>
  <div class="client-detail" id="clientDetail"></div>
  `;
}

/* ============ CHART INSTANTIATION ============ */
function makeCharts(){
  const c = chartColors();
  const barPalette = [c.accent, c.accent2, c.accent4, c.accent3, '#8B6FD6', '#4FB6C4'];

  // CA mensuel
  new Chart(document.getElementById('chartCA'), {
    type:'line',
    data:{ labels: DATA.ca_mensuel.labels, datasets:[{
      data: DATA.ca_mensuel.valeurs, borderColor:c.accent, backgroundColor:c.accent+'33',
      fill:true, tension:.35, pointRadius:2, borderWidth:2
    }]},
    options:{ plugins:{legend:{display:false}}, scales:{
      x:{ticks:{...baseTicks(), maxRotation:0, autoSkip:true, maxTicksLimit:8}, grid:{display:false}},
      y:{ticks:{...baseTicks(), callback:v=>(v/1000000).toFixed(1)+'M'}, grid:baseGrid()}
    }}
  });

  // Risque churn doughnut
  const rk = DATA.risque_churn;
  new Chart(document.getElementById('chartRisk'), {
    type:'doughnut',
    data:{ labels:Object.keys(rk), datasets:[{ data:Object.values(rk),
      backgroundColor:[c.accent3, c.accent, c.accent2], borderWidth:0 }]},
    options:{ plugins:{legend:{position:'bottom', labels:{color:c.muted, boxWidth:10, padding:14, font:{size:11.5}}}}, cutout:'62%' }
  });

  // CA par segment
  const casegEntries = Object.entries(DATA.ca_par_segment);
  new Chart(document.getElementById('chartCASeg'), {
    type:'bar',
    data:{ labels: casegEntries.map(e=>e[0]), datasets:[{ data: casegEntries.map(e=>e[1]),
      backgroundColor: barPalette, borderRadius:4, maxBarThickness:34 }]},
    options:{ indexAxis:'y', plugins:{legend:{display:false}}, scales:{
      x:{ticks:{...baseTicks(), callback:v=>(v/1000000).toFixed(1)+'M'}, grid:baseGrid()},
      y:{ticks:baseTicks(), grid:{display:false}}
    }}
  });

  // Clients par segment
  const clsegEntries = Object.entries(DATA.clients_par_segment);
  new Chart(document.getElementById('chartClientSeg'), {
    type:'pie',
    data:{ labels: clsegEntries.map(e=>e[0]), datasets:[{ data: clsegEntries.map(e=>e[1]), backgroundColor:barPalette, borderWidth:0 }]},
    options:{ plugins:{legend:{position:'bottom', labels:{color:c.muted, boxWidth:10, padding:10, font:{size:11}}}} }
  });

  // Top produits (marketing) — dynamic
  window._chartTopProd = new Chart(document.getElementById('chartTopProd'), {
    type:'bar', data:{ labels:[], datasets:[{ data:[], backgroundColor:c.accent, borderRadius:4, maxBarThickness:40 }]},
    options:{ plugins:{legend:{display:false}}, scales:{
      x:{ticks:baseTicks(), grid:{display:false}},
      y:{ticks:{...baseTicks(), callback:v=>(v/1000).toFixed(0)+'k'}, grid:baseGrid()}
    }}
  });
  updateTopProd(document.getElementById('segSelect').value);
  document.getElementById('segSelect').addEventListener('change', e=>updateTopProd(e.target.value));

  // Canaux
  const canaux = DATA.performance_canaux;
  new Chart(document.getElementById('chartCanaux'), {
    type:'bar',
    data:{ labels: canaux.map(x=>x.canal_acquisition), datasets:[{ label:'Satisfaction moy. (/5)', data: canaux.map(x=>x.satisfaction_moy),
      backgroundColor:c.accent4, borderRadius:4, maxBarThickness:30 }]},
    options:{ plugins:{legend:{display:false}}, scales:{
      x:{ticks:{...baseTicks(), maxRotation:20, minRotation:20}, grid:{display:false}},
      y:{min:0,max:5, ticks:baseTicks(), grid:baseGrid()}
    }}
  });

  // Sentiment
  const sent = DATA.sentiment_avis;
  new Chart(document.getElementById('chartSentiment'), {
    type:'doughnut',
    data:{ labels:Object.keys(sent), datasets:[{ data:Object.values(sent), backgroundColor:[c.accent2, c.muted, c.accent3], borderWidth:0 }]},
    options:{ plugins:{legend:{position:'bottom', labels:{color:c.muted, boxWidth:10, padding:12, font:{size:11.5}}}}, cutout:'55%' }
  });

  // Thèmes avis
  const th = DATA.themes_avis;
  new Chart(document.getElementById('chartThemes'), {
    type:'bar',
    data:{ labels:Object.keys(th), datasets:[{ data:Object.values(th), backgroundColor:barPalette, borderRadius:4, maxBarThickness:26 }]},
    options:{ indexAxis:'y', plugins:{legend:{display:false}}, scales:{
      x:{ticks:baseTicks(), grid:baseGrid()}, y:{ticks:baseTicks(), grid:{display:false}}
    }}
  });

  // Motifs réclamations
  const mot = DATA.motifs_reclamations;
  new Chart(document.getElementById('chartMotifs'), {
    type:'bar',
    data:{ labels:Object.keys(mot), datasets:[{ data:Object.values(mot), backgroundColor: c.accent3, borderRadius:4, maxBarThickness:28 }]},
    options:{ indexAxis:'y', plugins:{legend:{display:false}}, scales:{
      x:{ticks:baseTicks(), grid:baseGrid()}, y:{ticks:baseTicks(), grid:{display:false}}
    }}
  });

  // Gravité
  const gr = DATA.gravite_reclamations;
  new Chart(document.getElementById('chartGravite'), {
    type:'doughnut',
    data:{ labels:Object.keys(gr), datasets:[{ data:Object.values(gr), backgroundColor:[c.accent, c.accent3, c.accent2], borderWidth:0 }]},
    options:{ plugins:{legend:{position:'bottom', labels:{color:c.muted, boxWidth:10, padding:12, font:{size:11.5}}}}, cutout:'55%' }
  });
}

function updateTopProd(seg){
  const items = DATA.top_produits_par_segment[seg] || [];
  window._chartTopProd.data.labels = items.map(i=>i.produit);
  window._chartTopProd.data.datasets[0].data = items.map(i=>i.ca);
  window._chartTopProd.update();
}

/* ============ CLIENTS EXPLORER ============ */
function renderClientTable(){
  const search = document.getElementById('clientSearch').value.trim().toUpperCase();
  const fSeg = document.getElementById('filterSeg').value;
  const fRisk = document.getElementById('filterRisk').value;
  let rows = DATA.clients_table.filter(c=>{
    if(search && !c.client_id.includes(search)) return false;
    if(fSeg && c.segment_ia !== fSeg) return false;
    if(fRisk && c.niveau_risque !== fRisk) return false;
    return true;
  }).slice(0,150);
  const body = document.getElementById('clientTableBody');
  body.innerHTML = rows.map(c=>`
    <tr data-client="${c.client_id}" style="cursor:pointer;">
      <td><strong>${c.client_id}</strong></td><td>${c.ville}</td><td>${c.segment_ia}</td><td>${c.canal_acquisition}</td>
      <td>${c.nb_commandes}</td><td>${fmtFCFA(c.montant_total)}</td><td>${c.satisfaction}/5</td>
      <td><span class="pill risk-${c.niveau_risque}">${c.niveau_risque}</span></td>
    </tr>`).join('') || '<tr><td colspan="8" style="color:var(--muted);text-align:center;padding:24px;">Aucun client ne correspond à ces filtres.</td></tr>';
  body.querySelectorAll('tr[data-client]').forEach(tr=>{
    tr.addEventListener('click', ()=>showClientDetail(tr.dataset.client));
  });
}

function showClientDetail(id){
  const c = DATA.clients_table.find(x=>x.client_id===id);
  if(!c) return;
  const el = document.getElementById('clientDetail');
  el.classList.add('show');
  el.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;">
      <div><h3 style="font-size:16px;">${c.client_id} — ${c.ville}</h3>
      <p style="color:var(--muted);font-size:12px;margin-top:2px;">${c.segment_ia} · Acquis via ${c.canal_acquisition} · Produit favori : ${c.produit_favori || 'N/A'}</p></div>
      <button class="btn" id="btnClientReco">Recommandation personnalisée IA</button>
    </div>
    <div class="kv">
      <div>Commandes<strong>${c.nb_commandes}</strong></div>
      <div>CA total<strong>${fmtFCFA(c.montant_total)}</strong></div>
      <div>Satisfaction<strong>${c.satisfaction}/5</strong></div>
      <div>Risque de churn<strong>${Math.round(c.risque_churn)}/100</strong></div>
      <div>Dernier achat<strong>il y a ${Math.round(c.recence_jours)} j</strong></div>
      <div>Âge<strong>${c.age} ans</strong></div>
    </div>
    <div class="ai-output" id="outClientReco"></div>
  `;
  document.getElementById('btnClientReco').addEventListener('click', ()=>{
    askAgent(`Voici un client précis : ${JSON.stringify(c)}. En 4-5 lignes, propose une action commerciale concrète et personnalisée pour ce client (canal à utiliser, message clé, offre éventuelle), en te basant sur son segment et son niveau de risque.`,
      document.getElementById('outClientReco'));
  });
  el.scrollIntoView({behavior:'smooth', block:'nearest'});
}

/* ============ WIRE UP INTERACTIONS ============ */
function wireInteractions(){
  document.getElementById('clientSearch').addEventListener('input', renderClientTable);
  document.getElementById('filterSeg').addEventListener('change', renderClientTable);
  document.getElementById('filterRisk').addEventListener('change', renderClientTable);
  renderClientTable();

  document.getElementById('btnExecSummary').addEventListener('click', ()=>{
    askAgent("Rédige une synthèse exécutive pour le dirigeant de l'entreprise : 3 constats clés et 3 actions prioritaires à mener ce mois-ci, classées par impact business.",
      document.getElementById('outExecSummary'));
  });

  document.getElementById('btnNewsletterIdea').addEventListener('click', ()=>{
    const seg = document.getElementById('segSelect').value;
    askAgent(`Propose une idée de newsletter (objet + 2 lignes de contenu) ciblant spécifiquement le segment "${seg}", en t'appuyant sur ses produits favoris et le sentiment des avis clients.`,
      document.getElementById('outNewsletter'));
  });

  document.getElementById('main').addEventListener('click', e=>{
    const csBtn = e.target.closest('[data-crosssell]');
    if(csBtn){
      const o = JSON.parse(csBtn.dataset.crosssell.replace(/&#39;/g,"'"));
      const client = DATA.clients_table.find(c=>c.client_id===o.client_id) || {};
      const salesProfile = {...client, ...o};
      askAgent(`Rédige un court message WhatsApp (3-4 phrases, ton chaleureux et élégant) pour proposer ces produits au client. Profil client : ${JSON.stringify(salesProfile)}. Produits à présenter : ${o.produits_suggeres.join(', ')}.`,
        document.getElementById('outCrossSell'));
    }
    const arBtn = e.target.closest('[data-atrisk]');
    if(arBtn){
      const cid = arBtn.dataset.atrisk;
      const c = DATA.clients_risque_eleve.find(x=>x.client_id===cid);
      askAgent(`Ce client est à risque élevé de churn : ${JSON.stringify(c)}. Propose un plan d'action de rétention en 3 étapes concrètes pour l'équipe relation client, à mener cette semaine.`,
        document.getElementById('outAtRisk'));
    }
  });

  // chat
  const chatLog = document.getElementById('chatLog');
  function addMsg(role, text){
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    chatLog.appendChild(div);
    chatLog.scrollTop = chatLog.scrollHeight;
    return div;
  }
  async function sendChat(q){
    if(!q.trim()) return;
    addMsg('user', q);
    document.getElementById('chatInput').value = '';
    const aiDiv = addMsg('ai', '…');
    if(!claudeSample){
      try {
        if (typeof claude !== 'undefined') claudeSample = await claude.use('sample');
      } catch(e){}
    }
    if(!claudeSample){ aiDiv.textContent = localAgentResponse(q); return; }
    try{
      const res = await claudeSample([{role:'user', content: CONTEXT_SUMMARY + "\n\nQuestion : " + q}],
        { modelTier:'default', onText:({text})=>{ aiDiv.textContent = text; chatLog.scrollTop = chatLog.scrollHeight; } });
      aiDiv.textContent = res.text;
    }catch(err){ aiDiv.textContent = localAgentResponse(q); }
  }
  document.getElementById('chatSend').addEventListener('click', ()=>sendChat(document.getElementById('chatInput').value));
  document.getElementById('chatInput').addEventListener('keydown', e=>{ if(e.key==='Enter') sendChat(e.target.value); });
  document.querySelectorAll('.suggestion-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>sendChat(chip.dataset.q));
  });
}

wireInteractions();
if (typeof Chart !== 'undefined') {
  makeCharts();
} else {
  console.warn('Chart.js indisponible : les tableaux et la navigation restent disponibles.');
}
</script>
</body>
</html>
